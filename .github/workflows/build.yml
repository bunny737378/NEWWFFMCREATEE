name: FFmpeg Ultimate Android Compiler

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ffmpeg-android-release
  cancel-in-progress: false

jobs:
  build:
    name: Compile and Publish FFmpeg (MX Player Edition)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            curl wget git python3 zip unzip make cmake \
            ninja-build meson nasm pkg-config yasm clang

      - name: Setup Android NDK
        shell: bash
        run: |
          set -euo pipefail

          wget -q \
            https://dl.google.com/android/repository/android-ndk-r25c-linux.zip

          sudo unzip -q android-ndk-r25c-linux.zip -d /opt/

          echo "ANDROID_NDK_HOME=/opt/android-ndk-r25c" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_HOME=/opt/android-sdk" >> "$GITHUB_ENV"

          sudo mkdir -p /opt/android-sdk

      - name: Compile FFmpeg
        shell: bash
        env:
          ANDROID_NDK_HOME: /opt/android-ndk-r25c
          ANDROID_SDK_HOME: /opt/android-sdk
        run: |
          set -euo pipefail

          chmod +x ffmpeg-android-maker.sh scripts/*.sh scripts/*/*.sh

          # Compile using MX Player profile for full audio/video/subtitle decoder parity
          ./ffmpeg-android-maker.sh \
            --profile=mxplayer \
            -abis=arm64-v8a,armeabi-v7a

      - name: Package FFmpeg & MX Player Codec
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="ffmpeg-android"
          rm -rf "$PACKAGE" dist
          mkdir -p dist

          for ABI in arm64-v8a armeabi-v7a; do
            mkdir -p "$PACKAGE/$ABI/lib"
            mkdir -p "$PACKAGE/$ABI/include"
            mkdir -p "$PACKAGE/$ABI/bin"

            if [ -d "output/lib/$ABI" ]; then
              cp -a "output/lib/$ABI/." "$PACKAGE/$ABI/lib/"
            fi

            if [ -d "output/include/$ABI" ]; then
              cp -a "output/include/$ABI/." "$PACKAGE/$ABI/include/"
            fi

            BINARY="build/ffmpeg/$ABI/bin/ffmpeg"
            if [ -f "$BINARY" ]; then
              install -m 755 "$BINARY" "$PACKAGE/$ABI/bin/ffmpeg"
              ls -lh "$PACKAGE/$ABI/bin/ffmpeg"
            fi
          done

          cat > "$PACKAGE/BUILD-INFO.txt" <<EOF
FFmpeg Android Build (MX Player Ultimate Edition)
Repository: $GITHUB_REPOSITORY
Commit: $GITHUB_SHA
Run number: $GITHUB_RUN_NUMBER
Architectures: arm64-v8a, armeabi-v7a
Profile: MX Player (EAC3, AC3, TrueHD, MLP, DTS, DCA, libass, MediaCodec, dav1d, vpx)
EOF

          zip -qr dist/ffmpeg-android.zip "$PACKAGE"
          test -s dist/ffmpeg-android.zip
          unzip -t dist/ffmpeg-android.zip

          # Copy MX Player Custom Codec packages
          if [ -f "output/mx_aio.zip" ]; then
            cp output/mx_aio.zip dist/mx_aio.zip
            echo "MX Player AIO package found and copied to dist/mx_aio.zip"
          fi

          for f in output/mx_*.zip; do
            [ -f "$f" ] && cp "$f" dist/
          done

          echo "Packages ready for publishing:"
          ls -lh dist/

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="ffmpeg-android-latest"

          if gh release view "$TAG" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then

            echo "Deleting previous managed release: $TAG"

            gh release delete "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --yes \
              --cleanup-tag
          fi

          echo "Publishing new FFmpeg release..."

          RELEASE_ASSETS=(dist/*.zip)

          gh release create "$TAG" \
            "${RELEASE_ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "FFmpeg Android (MX Player Ultimate Edition) - Latest Build" \
            --notes "### FFmpeg Android (MX Player Custom Codec Edition)

Compiled with full decoders for all audio, video, and subtitle formats:

#### Included Packages:
- **mx_aio.zip**: All-In-One custom codec package ready to be imported directly into MX Player (**Settings > Decoder > Custom codec**).
- **ffmpeg-android.zip**: Full modular shared libraries (\`libavcodec.so\`, \`libavformat.so\`, etc.), C/C++ headers, and executables for Android development.
- **mx_\<abi\>.zip**: Individual architecture custom codec packages.

#### Codec Highlights:
- **Audio:** Dolby Digital (AC3), Dolby Digital Plus / Atmos (EAC3), Dolby TrueHD, MLP, DTS / DTS-HD Master Audio (DCA), AAC, Opus, MP3, FLAC, ALAC, APE (Monkey's Audio), WavPack, WMA (Pro/Lossless), AMR-NB/WB, RealAudio Cook.
- **Video:** HEVC / H.265 (Main10 HDR), H.264 (Hi10P), AV1 (dav1d), VP9, VP8, MPEG-4 (DivX/XviD), MPEG-2, VC-1, RealVideo RV40, Apple ProRes.
- **Hardware Acceleration:** Android MediaCodec HW Decoders enabled for H264, HEVC, MPEG4, VP8, VP9, AV1.
- **Subtitles:** Full SSA/ASS styling and font rendering via \`libass\` + \`libfreetype\` + \`libfribidi\`, SubRip (.srt), WebVTT, HDMV PGS, DVD VobSub, DVB.

**Commit:** $GITHUB_SHA
**Workflow Run:** $GITHUB_RUN_NUMBER" \
            --latest

          echo "Release published successfully."
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
