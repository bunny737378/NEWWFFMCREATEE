name: FFmpeg Ultimate Android Compiler

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ffmpeg-android-release
  cancel-in-progress: false

jobs:
  build:
    name: Compile and Publish Universal FFmpeg Android
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            curl wget git python3 zip unzip make cmake \
            ninja-build meson nasm pkg-config yasm clang

      - name: Setup Android NDK
        shell: bash
        run: |
          set -euo pipefail

          wget -q \
            https://dl.google.com/android/repository/android-ndk-r25c-linux.zip

          sudo unzip -q android-ndk-r25c-linux.zip -d /opt/

          echo "ANDROID_NDK_HOME=/opt/android-ndk-r25c" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_HOME=/opt/android-sdk" >> "$GITHUB_ENV"

          sudo mkdir -p /opt/android-sdk

      - name: Compile FFmpeg
        shell: bash
        env:
          ANDROID_NDK_HOME: /opt/android-ndk-r25c
          ANDROID_SDK_HOME: /opt/android-sdk
        run: |
          set -euo pipefail

          chmod +x ffmpeg-android-maker.sh scripts/*.sh scripts/*/*.sh tools/*.sh

          # Compile using Ultimate Universal profile with all decoders for ANY Android app
          ./ffmpeg-android-maker.sh \
            --profile=ultimate \
            -abis=arm64-v8a,armeabi-v7a

      - name: Package Universal FFmpeg for Android Apps
        shell: bash
        run: |
          set -euo pipefail

          PACKAGE="ffmpeg-android-ultimate"
          SINGLE_PACKAGE="ffmpeg-android-single-so"
          rm -rf "$PACKAGE" "$SINGLE_PACKAGE" dist
          mkdir -p dist "$PACKAGE" "$SINGLE_PACKAGE"

          for ABI in arm64-v8a armeabi-v7a; do
            mkdir -p "$PACKAGE/$ABI/lib"
            mkdir -p "$PACKAGE/$ABI/include"
            mkdir -p "$PACKAGE/$ABI/bin"
            mkdir -p "$SINGLE_PACKAGE/$ABI"

            # Copy modular libraries (libavcodec.so, libavformat.so, etc.)
            if [ -d "output/lib/$ABI" ]; then
              cp -a "output/lib/$ABI/." "$PACKAGE/$ABI/lib/"
            fi

            # Copy C/C++ API headers
            if [ -d "output/include/$ABI" ]; then
              cp -a "output/include/$ABI/." "$PACKAGE/$ABI/include/"
            fi

            # Copy unified single libffmpeg.so
            if [ -f "output/unified/$ABI/libffmpeg.so" ]; then
              cp "output/unified/$ABI/libffmpeg.so" "$PACKAGE/$ABI/lib/libffmpeg.so"
              cp "output/unified/$ABI/libffmpeg.so" "$SINGLE_PACKAGE/$ABI/libffmpeg.so"
            fi

            # Copy standalone CLI binaries
            BINARY="build/ffmpeg/$ABI/bin/ffmpeg"
            if [ -f "$BINARY" ]; then
              install -m 755 "$BINARY" "$PACKAGE/$ABI/bin/ffmpeg"
            fi
            PROBE_BIN="build/ffmpeg/$ABI/bin/ffprobe"
            if [ -f "$PROBE_BIN" ]; then
              install -m 755 "$PROBE_BIN" "$PACKAGE/$ABI/bin/ffprobe"
            fi
          done

          cat > "$PACKAGE/README.txt" <<EOF
========================================================================
             FFmpeg Android - Ultimate Universal Edition
========================================================================
This package contains FFmpeg compiled with maximum power (all audio,
video, and subtitle decoders, MediaCodec hardware acceleration, and
external libraries) ready to use in ANY Android application.

HOW TO USE IN YOUR ANDROID APPS:

Option 1: Using CMake / NDK in Android Studio
1. Copy '$PACKAGE/<abi>/include' into your app's 'src/main/cpp/include'.
2. Copy '$PACKAGE/<abi>/lib/*.so' into your app's 'src/main/jniLibs/<abi>/'.
3. In CMakeLists.txt, link target_link_libraries:
     avformat avcodec avfilter swresample swscale avutil

Option 2: Single-Library Drop-in (libffmpeg.so)
1. Copy 'libffmpeg.so' directly into 'app/src/main/jniLibs/<abi>/'.
2. In your Kotlin/Java code, simply call:
     System.loadLibrary("ffmpeg")

Option 3: ExoPlayer FFmpeg Extension
- Drop the .so files directly into ExoPlayer's 'extension-ffmpeg' module.

Option 4: Android Terminal / CLI
- Use 'bin/ffmpeg' or 'bin/ffprobe' directly via ProcessBuilder in your app.

Full decoders included:
- Audio: AC3, EAC3, TrueHD, MLP, DTS, DCA, AAC, Opus, MP3, FLAC, ALAC, APE, WavPack, WMA, AMR, Cook.
- Video: HEVC (Main10 HDR), H264 (Hi10P), AV1 (dav1d), VP9, VP8, MPEG4, VC1, RV40, ProRes.
- HW Acceleration: Android MediaCodec (H264, HEVC, MPEG4, VP8, VP9, AV1).
- Subtitles: libass (SSA/ASS styled fonts), SubRip (.srt), WebVTT, PGS, VobSub.
========================================================================
EOF

          # Create universal archive with modular libraries + headers + binaries
          zip -qr dist/ffmpeg-android-ultimate.zip "$PACKAGE"

          # Create single-library archive for simple JNI use
          zip -qr dist/ffmpeg-android-single-so.zip "$SINGLE_PACKAGE"

          echo "Universal packages ready for publishing:"
          ls -lh dist/


      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="ffmpeg-android-latest"

          if gh release view "$TAG" \
              --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then

            echo "Deleting previous managed release: $TAG"

            gh release delete "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --yes \
              --cleanup-tag
          fi

          echo "Publishing new FFmpeg release..."

          RELEASE_ASSETS=(dist/*.zip)

          cat > release-notes.md <<EOF
          ### FFmpeg Android Ultimate - Latest Build

          Universal FFmpeg Android binaries for Android apps, custom media players, ExoPlayer, NDK projects, video editors, and CLI tools.

          #### Included Packages

          - **ffmpeg-android-ultimate.zip**: Modular shared libraries, combined libffmpeg.so, C/C++ headers, and standalone ffmpeg/ffprobe binaries.
          - **ffmpeg-android-single-so.zip**: Single-library package containing libffmpeg.so for each supported architecture.

          #### Supported Architectures

          - arm64-v8a
          - armeabi-v7a

          #### Codec Capabilities

          - **Audio:** AC3, EAC3, TrueHD, MLP, DTS, AAC, Opus, MP3, FLAC, ALAC, APE, WavPack, WMA, AMR, and more.
          - **Video:** HEVC/H.265, H.264, AV1, VP9, VP8, MPEG-4, MPEG-1/2, VC-1, RealVideo, and ProRes.
          - **Hardware acceleration:** Android MediaCodec, where supported by the build and device.
          - **Subtitles:** ASS/SSA, SubRip, WebVTT, PGS, VobSub, and DVB, where enabled.

          **Commit:** $GITHUB_SHA
          **Workflow Run:** $GITHUB_RUN_NUMBER
          EOF

          gh release create "$TAG" \
            "${RELEASE_ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "FFmpeg Android Ultimate - Latest Build" \
            --notes-file release-notes.md \
            --latest

          echo "Release published successfully."

          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
